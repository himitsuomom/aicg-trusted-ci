checkout:
  skip: true

steps:
  - label: ":mag: Authenticated Semantic Verifier"
    key: aicg-semantic-verifier
    if: build.source == "trigger_job" && build.env("BUILDKITE_TRIGGERED_FROM_BUILD_PIPELINE_SLUG") == "aicg-trusted-gate" && build.env("AICG_VERIFIER_ENABLED") == "true"
    timeout_in_minutes: 30
    agents:
      queue: linux-small
    notify:
      - github_commit_status:
          context: buildkite/aicg-semantic-verifier/pr
        if: build.source == "trigger_job" && build.env("BUILDKITE_TRIGGERED_FROM_BUILD_PIPELINE_SLUG") == "aicg-trusted-gate" && build.env("AICG_VERIFIER_ENABLED") == "true"
    command: |
      set -euo pipefail
      trusted_commit="2570155ce96e213a0a3afac4cfcd9b3d039608b8"
      trusted_root="$$(mktemp -d "$${TMPDIR:-/tmp}/aicg-trusted-ci.XXXXXX")"
      trap 'rm -rf "$$trusted_root"' EXIT
      GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -C "$$trusted_root" init -q
      git -C "$$trusted_root" remote add origin https://github.com/himitsuomom/aicg-trusted-ci.git
      GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
        git -C "$$trusted_root" -c credential.helper= -c core.askPass=/bin/false \
        fetch --depth=1 origin "$$trusted_commit"
      test "$$(git -C "$$trusted_root" rev-parse FETCH_HEAD)" = "$$trusted_commit"
      GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
        git -C "$$trusted_root" archive --format=tar FETCH_HEAD | tar -xf - -C "$$trusted_root"
      "$$trusted_root/scripts/run-semantic-verifier.sh"
